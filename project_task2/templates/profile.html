<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card mx-auto shadow-sm" style="max-width: 500px;">
            <div class="card-body text-center">
                <h3 class="card-title mb-3">Welcome, {{ user.username or user.name }}!</h3>

                {% if user.avatar_url %}
                    <img src="{{ user.avatar_url }}" class="rounded-circle mb-3" width="120" height="120" alt="Avatar">
                {% endif %}

                <p><strong>Email:</strong> {{ user.email }}</p>

                {% if user.github_id %}
                    <p><strong>GitHub ID:</strong> {{ user.github_id }}</p>
                {% endif %}

                <p><strong>Auth Method:</strong> {{ user.auth_method }}</p>

                <a href="{{ url_for('logout') }}" class="btn btn-danger mt-3">Logout</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
