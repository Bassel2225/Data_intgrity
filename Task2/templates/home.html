<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home - Secure Auth App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-center d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <h1 class="mb-4">Welcome to the Secure Auth App 👋</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="d-grid gap-2 col-6 mx-auto">
            <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg">Login Manually</a>
            <a href="{{ url_for('github.login') }}" class="btn btn-dark btn-lg">
                <i class="bi bi-github"></i> Login with GitHub
            </a>
        </div>

        <p class="mt-4">
            Don't have an account? <a href="{{ url_for('signup') }}">Sign up here</a>
        </p>
    </div>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
